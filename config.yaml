model:
  name: xgboost
  random_state: 42

  parameters:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8

smote:
  random_state: 42

paths:
  raw_data: Data/Raw/creditcard.csv
  model: models/xgboost_fraud_pipeline.joblib
  preprocessor: models/preprocessor.joblib
  threshold: models/threshold.json
  metadata: models/model_metadata.json